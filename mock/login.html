<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申込管理システム（デモ）- ログイン</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body data-page="login">
  <header class="app-header">
    <p class="app-name" id="app-name">申込管理システム（デモ）</p>
  </header>

  <main>
    <section class="login-box" id="login-area">
      <h1 class="page-title">ログイン</h1>
      <form id="login-form" novalidate autocomplete="off">
        <div class="form-row">
          <label for="login-id">ログインID</label>
          <input type="text" id="login-id" name="login-id">
        </div>
        <div class="form-row">
          <label for="login-password">パスワード</label>
          <input type="password" id="login-password" name="login-password">
        </div>
        <p class="error-message" id="login-error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" id="login-button">ログイン</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
